<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pessoal, Urgente! A Fuga do 01</title>

  <!-- Fontes (sem internet, o jogo usa Impact e Arial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Pessoal, Urgente! A Fuga do 01"></canvas>

    <!-- Botões de toque (aparecem só no celular) -->
    <div id="touch">
      <div class="lado">
        <button data-act="left" aria-label="esquerda">&#9664;</button>
        <button data-act="right" aria-label="direita">&#9654;</button>
      </div>
      <div class="lado">
        <button data-act="jump" class="grande" aria-label="ação">&#9679;</button>
      </div>
    </div>
    <button id="m-pausa" aria-label="pausa"><i></i><i></i></button>
  </main>

  <!--
    A ORDEM DOS SCRIPTS IMPORTA:
    config (textos e sons) -> núcleo -> som -> desenhos -> cenas -> main
  -->
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/arte.js"></script>

  <!-- O motor dos microgames vem antes deles (eles se registram nele) -->
  <script src="js/cenas/rodada.js"></script>

  <!-- Os microgames: um arquivo para cada -->
  <script src="js/micro/desmente.js"></script>
  <script src="js/micro/algema.js"></script>
  <script src="js/micro/queiroz.js"></script>
  <script src="js/micro/salarios.js"></script>
  <script src="js/micro/picanha.js"></script>
  <script src="js/micro/compartilha.js"></script>
  <script src="js/micro/vota.js"></script>
  <script src="js/micro/boletos.js"></script>
  <script src="js/micro/solda.js"></script>
  <script src="js/micro/passinho.js"></script>

  <script src="js/cenas/titulo.js"></script>
  <script src="js/cenas/chefao.js"></script>
  <script src="js/cenas/urna.js"></script>
  <script src="js/cenas/final.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
