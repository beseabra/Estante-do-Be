<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1238">
<title>Expresso Butantã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
/* Layout: jogo em tela cheia; HUD é um mapa de linha de trem no topo, quase sem texto. Visual único (sem tema claro/escuro). */
:root{
  --uva:#4a2360; --uva-fundo:#2a1238; --creme:#fff4dc; --rubi:#c2184b; --amarela:#f6c21c; --mata:#3f9b5b; --chuva:#6f83a8;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:max(16px,env(safe-area-inset-left,0px)); --sr:max(16px,env(safe-area-inset-right,0px));
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--uva-fundo);color:var(--creme);font-family:var(--display);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--amarela);outline-offset:4px}
svg{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding-top:calc(var(--st) + 14px);padding-left:var(--sl);padding-right:var(--sr);display:flex;flex-direction:column;gap:12px;align-items:center}
#route{width:min(560px,100%);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}
.face{width:44px;height:44px;border-radius:50%;border:3px solid var(--creme);background:#ffd9a0 center/cover;box-sizing:border-box}
#line{position:relative;height:12px;display:flex;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#line i{display:block;height:100%}
#line i:first-child{border-radius:6px 0 0 6px}#line i:nth-child(4){border-radius:0 6px 6px 0}
#me{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px;border-radius:50%;background:var(--creme);border:5px solid var(--uva);box-sizing:border-box}
#row{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:flex;align-items:center;gap:8px;font-size:22px;background:rgba(42,18,56,.72);border-radius:12px;padding:7px 12px;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
#bat{gap:3px}
#bat b{display:block;width:11px;height:20px;border-radius:3px;background:#7be08a;transition:background .2s}
#bat b.off{background:rgba(255,255,255,.18)}
#bat u{display:block;width:4px;height:10px;border-radius:0 3px 3px 0;background:var(--creme)}
#btns{display:flex;gap:8px;pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;background:rgba(42,18,56,.72);display:grid;place-items:center}
.ib svg{width:22px;height:22px}
#pw{display:flex;gap:10px;min-height:52px}
.pw{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amarela) calc(var(--p)*1%),rgba(42,18,56,.6) 0)}
.pw span{width:42px;height:42px;border-radius:50%;background:var(--uva);display:grid;place-items:center}
.pw svg{width:26px;height:26px}
#bub{position:fixed;right:var(--sr);top:calc(var(--st) + 132px);display:flex;align-items:center;gap:8px;background:var(--creme);border-radius:30px 6px 30px 30px;padding:8px 8px 8px 16px;transform:translateX(160%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#bub.on{transform:none}
#bub>svg,#bubi svg{width:34px;height:34px}
#bub .face{border-color:var(--rubi)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;pointer-events:none;padding-left:var(--sl);padding-right:var(--sr);padding-block:calc(var(--st) + 5vh) calc(var(--sb) + 5vh)}
.scr>*{pointer-events:auto}
h1{margin:0;font-weight:400;font-size:clamp(34px,10vw,84px);line-height:.92;text-align:center;color:var(--creme);text-shadow:0 4px 0 var(--uva),0 8px 0 rgba(42,18,56,.45);text-wrap:balance;pointer-events:none}
h1 em{font-style:normal;color:var(--amarela)}
.go{width:104px;height:104px;border-radius:50%;background:var(--rubi);display:grid;place-items:center;box-shadow:0 8px 0 #7d0c2e,0 18px 30px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #7d0c2e}
.go svg{width:50px;height:50px}
.foot{display:flex;flex-direction:column;align-items:center;gap:22px}
.keys{display:flex;gap:10px}
.keys span{width:46px;height:46px;border-radius:12px;background:rgba(42,18,56,.72);display:grid;place-items:center}
.keys svg{width:26px;height:26px}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats .chip{font-size:26px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px 30px var(--rubi)}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
@media (max-height:480px){.go{width:76px;height:76px}.go svg{width:36px;height:36px}.foot{gap:12px;flex-direction:row}h1{font-size:40px}.scr{padding-block:calc(var(--st) + 12px) calc(var(--sb) + 18px)}}
</style>
</head>
<body>

<canvas id="c" aria-label="Jogo de corrida de Jundiaí ao Butantã"></canvas>
<div id="flash"></div><div id="hurt"></div>

<div id="hud" hidden>
  <div id="route"><div class="face" id="fHim"></div><div id="line"><i></i><i></i><i></i><i></i><div id="me"></div></div><div class="face" id="fHer"></div></div>
  <div id="row">
    <div class="chip"><span data-i="heart"></span><span id="hN">0</span></div>
    <div class="chip" id="bat"><b></b><b></b><b></b><u></u></div>
    <div id="btns"><button class="ib" id="bMute" aria-label="Som"></button><button class="ib" id="bPause" aria-label="Pausar" data-i="pause"></button></div>
  </div>
  <div id="pw"></div>
</div>
<div id="bub"><span id="bubi"></span><div class="face" id="fHer2"></div></div>

<div class="scr" id="sMenu">
  <h1>Expresso<br><em>Butantã</em></h1>
  <div class="foot">
    <button class="go" id="bPlay" aria-label="Jogar" data-i="play"></button>
    <div class="keys" aria-label="Deslize ou use as setas"><span data-i="left"></span><span data-i="up"></span><span data-i="down"></span><span data-i="right"></span></div>
  </div>
</div>
<div class="scr" id="sPause" hidden><span></span><button class="go" id="bResume" aria-label="Continuar" data-i="play"></button><span></span></div>
<div class="scr" id="sOver" hidden>
  <div class="stats"><div class="chip"><span data-i="heart"></span><span id="oH"></span></div></div>
  <button class="go" id="bRetry" aria-label="Tentar de novo" data-i="again"></button>
</div>
<div class="scr" id="sEnd" hidden>
  <h1><em>Cheguei!</em></h1>
  <div class="foot">
    <div class="stats"><div class="chip"><span data-i="heart"></span><span id="eH"></span></div><div class="chip"><span data-i="clock"></span><span id="eT"></span></div><div class="chip"><span data-i="train"></span><span id="eV"></span></div></div>
    <button class="go" id="bNext" aria-label="Ir de novo" data-i="again"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">Sem conexão. Recarregue a página.</div>');return}
const T=THREE, PI=Math.PI, {sin,cos,abs,min,max,floor,random}=Math;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>max(a,min(b,v)), pick=a=>a[floor(random()*a.length)];
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const CALM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- ícones ---------- */
const sv=(d,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="#fff4dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ${x} aria-hidden="true">${d}</svg>`;
const HP='M12 21C5 15.5 2 12 2 8a5 5 0 0 1 10-1.5A5 5 0 0 1 22 8c0 4-3 7.500-10 13z';
const IC={
 heart:sv(`<path d="${HP}" fill="#ff4f7b" stroke="none"/>`),
 play:sv('<path d="M7 4l13 8-13 8z" fill="#fff4dc"/>'),
 pause:sv('<path d="M8 5v14M16 5v14" stroke-width="4"/>'),
 again:sv('<path d="M20 12a8 8 0 1 1-2.500-5.800M20 3v5h-5"/>'),
 left:sv('<path d="M19 12H5M11 6l-6 6 6 6"/>'), right:sv('<path d="M5 12h14M13 6l6 6-6 6"/>'),
 up:sv('<path d="M12 19V5M6 11l6-6 6 6"/>'), down:sv('<path d="M12 5v14M6 13l6 6 6-6"/>'),
 son:sv('<path d="M4 9v6h4l5 4V5L8 9z" fill="#fff4dc" stroke-width="2"/><path d="M17 8a6 6 0 0 1 0 8" stroke-width="2.500"/>'),
 soff:sv('<path d="M4 9v6h4l5 4V5L8 9z" fill="#fff4dc" stroke-width="2"/><path d="M17 9l5 6M22 9l-5 6" stroke-width="2.500"/>'),
 clock:sv('<circle cx="12" cy="12" r="9" stroke="#c2184b" fill="#fff"/><path d="M12 7v5l4 2" stroke="#4a2360"/>'),
 umb:sv('<path d="M2 12a10 10 0 0 1 20 0z" fill="#f6c21c" stroke="#c98f00" stroke-width="1.500"/><path d="M12 12v7a2.500 2.500 0 0 0 5 0" stroke="#c2184b" stroke-width="2.500"/>'),
 mouse:sv('<circle cx="7" cy="8" r="4" fill="#f6a5b5" stroke="none"/><circle cx="17" cy="8" r="4" fill="#f6a5b5" stroke="none"/><ellipse cx="12" cy="14" rx="8" ry="7" fill="#fff" stroke="none"/><circle cx="9" cy="13" r="1.300" fill="#2a1238" stroke="none"/><circle cx="15" cy="13" r="1.300" fill="#2a1238" stroke="none"/><circle cx="12" cy="17" r="1.400" fill="#f6a5b5" stroke="none"/>'),
 coffee:sv('<path d="M4 9h12v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#fff" stroke="none"/><path d="M16 11h2a2.500 2.500 0 0 1 0 5h-2M8 6V3M12 6V3" stroke-width="2.200"/>'),
 train:sv('<rect x="5" y="3" width="14" height="14" rx="3" fill="#c2184b" stroke="none"/><path d="M8 7h8v4H8z" fill="#fff4dc" stroke="none"/><path d="M7 21l2-3M17 21l-2-3" stroke-width="2.500"/>'),
 eyes:sv('<circle cx="7" cy="12" r="5" fill="#fff" stroke="#4a2360" stroke-width="1.500"/><circle cx="17" cy="12" r="5" fill="#fff" stroke="#4a2360" stroke-width="1.500"/><circle cx="8" cy="12" r="2.200" fill="#3f9b5b" stroke="none"/><circle cx="18" cy="12" r="2.200" fill="#3f9b5b" stroke="none"/>')
};
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=IC[e.dataset.i]);

/* ---------- renderer ---------- */
let R;
try{R=new T.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'})}
catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">Este navegador está sem WebGL.</div>');return}
R.outputEncoding=T.sRGBEncoding; R.shadowMap.enabled=true; R.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(), cam=new T.PerspectiveCamera(60,1,.1,500);
const C=h=>new T.Color(h).convertSRGBToLinear();
scene.fog=new T.Fog(0xffffff,45,150);
const hemi=new T.HemisphereLight(0xffffff,0x888888,.8); scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,.9); sun.position.set(-9,18,9); sun.target.position.set(0,0,-9);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-.002;
Object.assign(sun.shadow.camera,{left:-15,right:15,top:20,bottom:-20,near:1,far:60}); scene.add(sun,sun.target);

const uB={value:new T.Vector2(0,.0009)};
function bend(m){m.onBeforeCompile=s=>{s.uniforms.uB=uB;s.vertexShader='uniform vec2 uB;\n'+s.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\nfloat bd=max(0.,-mvPosition.z-9.);mvPosition.x+=bd*bd*uB.x;mvPosition.y-=bd*bd*uB.y;gl_Position=projectionMatrix*mvPosition;')};return m}
const LIT=bend(new T.MeshLambertMaterial({vertexColors:true}));
const GLOW=bend(new T.MeshBasicMaterial({vertexColors:true}));

const skyM=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{a:{value:new T.Color()},b:{value:new T.Color()}},
 vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 a,b;varying vec3 p;void main(){float h=smoothstep(-.02,.42,normalize(p).y);gl_FragColor=vec4(mix(b,a,h),1.);}'});
const sky=new T.Mesh(new T.SphereGeometry(300,24,16),skyM); sky.renderOrder=-10; sky.frustumCulled=false; scene.add(sky);

/* ---------- construtor de malhas ---------- */
const _m=new T.Matrix4(),_q=new T.Quaternion(),_e=new T.Euler(),_p=new T.Vector3(),_s=new T.Vector3();
class B{
 constructor(){this.P=[];this.N=[];this.K=[]}
 add(g,col,x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){
  g=g.index?g.toNonIndexed():g.clone();
  g.applyMatrix4(_m.compose(_p.set(x,y,z),_q.setFromEuler(_e.set(rx,ry,rz)),_s.set(sx,sy,sz)));
  const a=g.attributes.position.array,n=g.attributes.normal.array,c=C(col);
  for(let i=0;i<a.length;i++){this.P.push(a[i]);this.N.push(n[i])}
  for(let i=0;i<a.length/3;i++)this.K.push(c.r,c.g,c.b);
  return this}
 box(w,h,d,c,x,y,z,rx,ry,rz){return this.add(new T.BoxGeometry(w,h,d),c,x,y,z,rx,ry,rz)}
 cyl(a,b,h,c,x,y,z,rx,ry,rz,s=10){return this.add(new T.CylinderGeometry(a,b,h,s),c,x,y,z,rx,ry,rz)}
 sph(r,c,x,y,z,sx=1,sy=1,sz=1,s=12){return this.add(new T.SphereGeometry(r,s,max(6,floor(s*.7))),c,x,y,z,0,0,0,sx,sy,sz)}
 cone(r,h,c,x,y,z,rx,ry,rz,s=8){return this.add(new T.ConeGeometry(r,h,s),c,x,y,z,rx,ry,rz)}
 blob(r,c,x,y,z,sx=1,sy=1,sz=1){return this.add(new T.IcosahedronGeometry(r,1),c,x,y,z,0,r*7,0,sx,sy,sz)}
 cap(r,h,c,x,y,z,rx=0,ry=0,rz=0){const p=[];for(let i=0;i<=5;i++){const a=-PI/2+i*PI/10;p.push(new T.Vector2(max(.0001,cos(a)*r),sin(a)*r-h/2))}for(let i=0;i<=5;i++){const a=i*PI/10;p.push(new T.Vector2(max(.0001,cos(a)*r),sin(a)*r+h/2))}return this.add(new T.LatheGeometry(p,12),c,x,y,z,rx,ry,rz)}
 tor(r,t,arc,c,x,y,z,rx,ry,rz){return this.add(new T.TorusGeometry(r,t,6,14,arc),c,x,y,z,rx,ry,rz)}
 geo(){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(this.P,3));g.setAttribute('normal',new T.Float32BufferAttribute(this.N,3));g.setAttribute('color',new T.Float32BufferAttribute(this.K,3));return g}
 mesh(sh=true){const m=new T.Mesh(this.geo(),LIT);m.castShadow=sh;return m}
}
const grp=(...a)=>{const g=new T.Group();a.forEach(o=>g.add(o));return g};

/* ---------- personagens (olham para -z) ---------- */
function mouseInto(b,x,y,z,k=1,ry=0){
 const c=cos(ry),s=sin(ry),at=(lx,ly,lz)=>[x+(lx*c+lz*s)*k,y+ly*k,z+(-lx*s+lz*c)*k];
 b.sph(.2*k,'#ffffff',...at(0,.18,0),.85,.85,1.2).sph(.13*k,'#ffffff',...at(0,.26,-.24));
 for(const e of[-1,1])b.sph(.085*k,'#f4a3b4',...at(.11*e,.4,-.18),1,1,.5).sph(.026*k,'#2a1238',...at(.06*e,.29,-.35));
 b.sph(.03*k,'#f4778f',...at(0,.24,-.37)).cyl(.018*k,.03*k,.42*k,'#f4a3b4',...at(0,.14,.4),PI/2-.4,ry,0,6);
}
function flowersInto(b,x,y,z){
 [[-.13,.05,.12],[.02,.18,-.08],[.16,.02,-.28]].forEach(([dx,dy,t])=>{
  b.cyl(.018,.018,.4,'#3c8a3f',x+dx*.7,y+dy-.1,z,0,0,t,5);
  const cx=x+dx,cy=y+.16+dy,cz=z+.06;
  for(let i=0;i<9;i++){const a=i/9*PI*2;b.sph(.055,'#ffc81f',cx+cos(a)*.115,cy+sin(a)*.115,cz,1,1,.5,6)}
  b.sph(.085,'#6b3a17',cx,cy,cz+.02,1,1,.6,8)});
}
function person(o){
 const root=new T.Group(),body=new T.Group();root.add(body);
 const sk=o.skin;
 const t=new B();
 t.cap(.24,.3,o.top,0,1.15,0).sph(.23,o.bot,0,.88,0,1,.75,.85);
 if(o.him){
  t.tor(.17,.06,PI*2,o.top2,0,1.43,0,PI/2).box(.04,.42,.02,'#f6e7c9',0,1.15,-.235).cap(.05,.2,o.top2,0,.93,-.2,0,0,PI/2);
  t.box(.07,.46,.05,'#174a4e',-.16,1.2,-.21).box(.07,.46,.05,'#174a4e',.16,1.2,-.21);
  t.cap(.2,.26,'#23767a',0,1.14,.3).box(.36,.36,.2,'#23767a',0,1.1,.3).cap(.11,.1,'#f6c21c',0,1,.44,0,0,PI/2).box(.22,.03,.03,'#174a4e',0,1.36,.46);
  flowersInto(t,.16,1.38,.34);
 }else{
  t.cyl(.25,.36,.62,'#fbfbf7',0,.84,.02,0,0,0,14).cap(.255,.26,'#fbfbf7',0,1.16,.02);
  t.box(.2,.5,.06,o.top,0,1.18,-.235).box(.17,.42,.06,o.bot,0,.75,-.3,.15);
  t.box(.12,.1,.04,'#e6e9ea',.2,.82,-.31).box(.02,.12,.03,'#2f6fd0',.18,.88,-.33).box(.02,.12,.03,'#c2184b',.22,.88,-.33);
  t.box(.1,.24,.03,'#e6e9ea',-.13,1.3,-.24,0,0,.35).box(.1,.24,.03,'#e6e9ea',.13,1.3,-.24,0,0,-.35);
  mouseInto(t,-.27,1.4,.02,.62);
 }
 const tm=t.mesh();body.add(tm);
 // cabeça
 const h=new B();
 h.cyl(.1,.12,.18,sk,0,-.36,0).sph(.36,sk,0,0,0,1,1.04,.96,18);
 for(const e of[-1,1]){
  h.sph(.075,sk,.355*e,-.04,.02,.6,1,.8,8);
  h.sph(.092,'#ffffff',.135*e,.02,-.3,.95,1.2,.55,12).sph(.062,o.eye,.13*e,.015,-.343,1,1.15,.5,10).sph(.034,'#141126',.13*e,.015,-.367,1,1.1,.5,8).sph(.016,'#ffffff',.13*e+.022,.045,-.383,1,1,.6,6);
  h.box(.13,.028,.03,o.hairD,.135*e,.17,-.325,0,0,e*(o.him?-.12:.08));
  h.sph(.06,o.blush,.2*e,-.11,-.272,1.1,.7,.5,8);
  if(!o.him)h.box(.05,.018,.02,'#2b1b12',.215*e,.09,-.31,0,0,e*.5);
 }
 h.sph(.045,sk,0,-.07,-.352,1,.9,.9,8).tor(.09,.018,PI,o.lip,0,-.15,-.315,.25,0,PI);
 if(o.him){
  h.sph(.385,o.hair,0,.09,.075,1.02,.98,.95,16);
  h.cap(.11,.34,o.hair,-.02,.31,-.2,0,0,PI/2+.12).cap(.1,.2,o.hairL,.1,.36,-.23,.2,0,PI/2-.3).cap(.1,.16,o.hair,-.2,.24,-.22,0,0,PI/2+.6);
  [[-.2,.36,0,.5],[0,.43,.04,0],[.2,.37,.02,-.5],[-.12,.4,.16,.3],[.13,.38,.18,-.3],[0,.3,.3,0],[-.2,.22,.28,.4],[.22,.2,.26,-.4]].forEach(([x,y,z,r],i)=>h.cone(.13,.26,i%2?o.hairL:o.hair,x,y,z,.5+z*2,0,r,7));
  h.sph(.1,o.hair,-.33,.02,.02,.5,1.2,1,8).sph(.1,o.hair,.33,.02,.02,.5,1.2,1,8);
  [[-.17,-.17,.3],[0,-.2,.32],[.17,-.17,.3]].forEach(([x,y,z])=>h.cone(.1,.2,o.hairD,x,y,z-.02,PI,0,0,6));
 }else{
  h.sph(.39,o.hair,0,.07,.07,1.04,1,.98,16);
  h.cap(.1,.26,o.hair,-.14,.29,-.2,.2,0,PI/2+.5).cap(.1,.26,o.hairL,.14,.29,-.2,.2,0,PI/2-.5);
